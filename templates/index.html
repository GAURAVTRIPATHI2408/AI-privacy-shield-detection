<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Privacy Shield</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #123653,
                    #050a12 65%
                );

            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 40px;

            align-items: center;
        }

        .left h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .left h1 span {
            color: #42d8ff;
        }

        .left p {
            color: #91a8ba;
            line-height: 1.7;
        }

        .shield {
            font-size: 80px;
        }

        .card {
            padding: 35px;

            border-radius: 20px;

            background:
                rgba(10,25,40,.85);

            border:
                1px solid
                rgba(80,180,230,.2);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.4);

            text-align: center;
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #7890a5;
            font-size: 13px;
        }

        .btn {
            display: block;

            padding: 14px;

            margin-top: 15px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            background: #1688c7;

            color: white;
        }

        .btn.secondary {
            background: #102d43;
        }

        @media(max-width:700px) {

            .container {
                grid-template-columns: 1fr;
            }

            .left {
                text-align: center;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="left">

        <div class="shield">
            🛡️
        </div>

        <h1>
            AI <span>Privacy Shield</span>
        </h1>

        <p>
            Real-time intelligent screen protection
            using computer vision and AI face detection.
        </p>

        <p>
            Detect multiple viewers and protect
            your private screen automatically.
        </p>

    </div>


    <div class="card">

        <h2>
            Welcome
        </h2>

        <p>
            Secure your screen with AI-powered
            privacy monitoring.
        </p>

        <a
            href="{{ url_for('login') }}"
            class="btn">

            Login

        </a>

        <a
            href="{{ url_for('register') }}"
            class="btn secondary">

            Create Account

        </a>

    </div>

</div>

</body>

</html>
